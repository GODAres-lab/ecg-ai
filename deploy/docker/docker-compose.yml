services:
  ecg-app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - APP_URL=${APP_URL:-http://localhost}
    volumes:
      - ecg_data:/app/data
    networks:
      - ecg_network
    # Port 3000 is intentionally NOT exposed directly to host; all traffic enters via nginx

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/ecg-ai-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ecg-app
    networks:
      - ecg_network

volumes:
  ecg_data:

networks:
  ecg_network:
    driver: bridge
