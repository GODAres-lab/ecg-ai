# ==============================================================================
# AI ECG Analyzer — Docker Compose Nginx Configuration
# Mounted inside nginx container at /etc/nginx/conf.d/default.conf
# Routes upstream traffic to the internal `ecg-app:3000` container service.
# ==============================================================================

limit_req_zone $binary_remote_addr zone=ecg_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ecg_auth_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=ecg_analyze_limit:10m rate=1r/s;

upstream ecg_ai_upstream {
    server ecg-app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    client_max_body_size 30M;
    client_body_buffer_size 256k;

    proxy_connect_timeout 30s;
    proxy_send_timeout 90s;
    proxy_read_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self \"https://app.midtrans.com\" \"https://app.sandbox.midtrans.com\")" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /api/analyze-ecg {
        limit_req zone=ecg_analyze_limit burst=5 nodelay;
        proxy_pass http://ecg_ai_upstream;
        proxy_request_buffering off;
    }

    location ~ ^/api/auth/(login|register) {
        limit_req zone=ecg_auth_limit burst=5 nodelay;
        proxy_pass http://ecg_ai_upstream;
    }

    location /api/ {
        limit_req zone=ecg_api_limit burst=20 nodelay;
        proxy_pass http://ecg_ai_upstream;
    }

    location /assets/ {
        proxy_pass http://ecg_ai_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://ecg_ai_upstream;
    }
}

