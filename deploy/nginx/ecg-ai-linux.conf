# ==============================================================================
# AI ECG Analyzer — Production Nginx Site Configuration (Linux VPS)
# Target Path: /etc/nginx/sites-available/ecg-ai (symlinked to sites-enabled)
#
# After deploying this file, enable automatic Let's Encrypt HTTPS + HTTP->HTTPS
# redirect with a single command:
#   sudo certbot --nginx -d ecg.yourdomain.com --redirect
# ==============================================================================

# Rate limiting zones (Defense-in-depth at reverse proxy layer)
limit_req_zone $binary_remote_addr zone=ecg_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ecg_auth_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=ecg_analyze_limit:10m rate=1r/s;

# Upstream Node.js application process (bound internally to 127.0.0.1:3000)
upstream ecg_ai_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # Replace "_" with your domain (e.g. ecg.yourdomain.com) or pass domain to deploy-linux.sh
    server_name _;

    # Hide Nginx version banner
    server_tokens off;

    # Support high-resolution 12-lead ECG photo uploads up to 30MB
    client_max_body_size 30M;
    client_body_buffer_size 256k;

    # Timeouts for Multimodal AI Vision Analysis
    proxy_connect_timeout 30s;
    proxy_send_timeout 90s;
    proxy_read_timeout 120s;

    # OWASP ASVS Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self \"https://app.midtrans.com\" \"https://app.sandbox.midtrans.com\")" always;

    # Standard Reverse Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Let's Encrypt Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 1. AI ECG Vision Analysis Endpoint (Dedicated rate limiting)
    location = /api/analyze-ecg {
        limit_req zone=ecg_analyze_limit burst=5 nodelay;
        proxy_pass http://ecg_ai_upstream;
        proxy_request_buffering off;
    }

    # 2. Authentication Endpoints (Brute-force protection)
    location ~ ^/api/auth/(login|register) {
        limit_req zone=ecg_auth_limit burst=5 nodelay;
        proxy_pass http://ecg_ai_upstream;
    }

    # 3. General API Routes
    location /api/ {
        limit_req zone=ecg_api_limit burst=20 nodelay;
        proxy_pass http://ecg_ai_upstream;
    }

    # 4. Immutable Vite Static Assets Caching (dist/assets)
    location /assets/ {
        proxy_pass http://ecg_ai_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 5. SPA Frontend Fallback
    location / {
        proxy_pass http://ecg_ai_upstream;
    }
}
